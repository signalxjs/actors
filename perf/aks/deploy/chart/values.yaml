# Everything deployment-specific lives here — the image is generic.

image:
  # REQUIRED at install: --set image.repository=<registry>/sigx-actors-test.
  # No default on purpose — this chart is public, and a registry hostname
  # is deployment identity. `testenv.mjs` derives it from $ACR.
  repository: ""
  # REQUIRED at install: --set image.tag=<git-short-sha>. Immutable tags
  # only — the chart never deploys :latest.
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 3
port: 7311

# redis | k8s — k8s swaps host liveness onto coordination.k8s.io Leases
# (adds the ServiceAccount + Lease RBAC below); the directory and actor
# state stay in Redis either way.
membership: redis

env:
  # Redis key namespace (cluster + storage + reminders).
  sigxNamespace: sigx
  # undici pool size per peer origin for host-to-host fetch.
  fetchConnections: 64
  # http | tcp — the HOST-TO-HOST link (#203). Every recorded baseline was
  # measured over http; tcp multiplexes every stream onto one connection per
  # peer, so the `fetchConnections` arithmetic that bound the identity
  # ceiling (#194) does not apply to it. Part of INFRA_SHAPE: a run over one
  # is not comparable with a run over the other.
  transport: http
  tcpPort: 7312

secrets:
  # Empty = generated on install and PRESERVED on upgrade (lookup guard).
  # A regenerated clusterSecret mid-rollout would partition the cluster
  # into two mutually-401 halves.
  clusterSecret: ""
  opsSecret: ""
  # Signs the session cookies the per-user socket arm presents.
  sessionSecret: ""

# The client-facing WebSocket endpoint (#172).
socket:
  # Mounts /_sigx/socket on the host. Off keeps the deployment byte-identical
  # to the one the HTTP baselines were recorded against.
  enabled: false
  # Verify signed session cookies, so a subscriber can carry a principal.
  # This is what the coalescing arm needs: cross-host live subscriptions
  # share ONE remote stream per principal, so anonymous and per-user
  # subscribers are different measurements (#138).
  sessions: false
  # Every socket cap is a scale variable, so every one is a knob. EMPTY =
  # the runtime's own default, which is NOT the same as 0 — 0 disables
  # pingMs, revalidateMs and maxConnectionMs deliberately. An empty value
  # omits the variable entirely (see host-deployment.yaml).
  env:
    SOCKET_PATH: ""
    SOCKET_ORIGIN: ""
    SOCKET_MAX_CONCURRENT: ""
    SOCKET_MAX_SUBSCRIPTIONS: ""
    SOCKET_MAX_MESSAGE_BYTES: ""
    SOCKET_PING_MS: ""
    SOCKET_REVALIDATE_MS: ""
    SOCKET_MAX_CONNECTION_MS: ""

# D2ls_v6 nodes are 2 vCPU / 4 GiB; leave headroom for kubelet + system.
resources:
  requests:
    cpu: 1000m
    memory: 512Mi
  limits:
    cpu: 1800m
    memory: 1Gi

probes:
  # The recipe from the Kubernetes guide: startup covers a slow boot
  # (Redis join), liveness stays cheap, readiness 503s for the whole drain
  # window ('leaving', 'fenced', 'joining').
  # https://sigx.dev/actors/docs/kubernetes/
  startup:
    failureThreshold: 30
    periodSeconds: 2
  liveness:
    periodSeconds: 10
  readiness:
    periodSeconds: 5

lifecycle:
  # Let the endpoint controllers notice ready=503 before SIGTERM starts
  # the drain.
  preStopSleepSeconds: 10
# Must cover preStop + the 30s actor drain deadline, with margin.
terminationGracePeriodSeconds: 60

pdb:
  enabled: true
  maxUnavailable: 1

hpa:
  enabled: false
  minReplicas: 3
  maxReplicas: 8
  targetCPUUtilizationPercentage: 60

# The dedicated tainted node pool — every pod in this chart carries these.
nodeSelector:
  workload: sigx-actors-test
tolerations:
  - key: workload
    operator: Equal
    value: sigx-actors-test
    effect: NoSchedule

affinity:
  # Redis and hosts must never share a node: Redis carries the actor state
  # and colocation both skews host perf numbers and lets hosts starve
  # Redis. Both directions are required, so scale-out never lands a host
  # on the Redis node.
  hostAntiRedis: required
  redisAntiHost: required
  # host-vs-host spread: preferred packs within the pool; set to required
  # to force one-per-node (the cluster-autoscaler scenario).
  hostSelfSpread: preferred

redis:
  enabled: true
  # External Redis instead of the in-chart pod: set enabled=false and
  # point url at it (redis://host:6379). With enabled=true, url overrides
  # the default in-chart Service address (rarely wanted).
  url: ""
  image: redis:7-alpine
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1800m
      memory: 1Gi
  # AOF + a PVC: actor state survives Redis pod restarts (the Redis-outage
  # scenario recovers from the append log, not from luck).
  appendonly: true
  persistence:
    enabled: true
    size: 2Gi
    storageClass: managed-csi

loadgen:
  # Rendered per-run, never part of `helm install`:
  #   helm template sigx <chart> -s templates/loadgen-job.yaml \
  #     --set loadgen.enabled=true --set loadgen.nameSuffix=$(date +%s) ... \
  #     | kubectl apply -f -
  enabled: false
  # Jobs are immutable — a unique suffix per run.
  nameSuffix: ""
  parallelism: 1
  backoffLimit: 0
  # counter | crunch | mixed | verify | jobs | workflow
  mode: counter
  concurrency: 32
  durationS: 60
  keyCount: 1000
  hotRatio: "0.2"
  # e.g. "1,2,4,8,16,32,64" for the baseline ladder
  sweep: ""
  crunchIters: 200
  crunchPayload: 1024
  # Default: the host service in-namespace.
  targetUrl: ""
  # The workflow-engine workload (#297), `mode: workflow`. Every value is a
  # `WF_*` env on the generator; EMPTY omits the variable (the generator's
  # own default applies), exactly as `socket.env` does on the host. Two of
  # them shape the whole run: `startRate` is runs/s of OPEN-LOOP arrivals
  # (`sweep` above becomes a list of rate rungs in this mode), and `mix` is
  # the template weighting.
  wf:
    WF_START_RATE: ""
    WF_ARRIVAL: ""
    WF_MIX: ""
    WF_MAX_INFLIGHT: ""
    WF_POLL_MS: ""
    WF_DRAIN_S: ""
    WF_TASK_MS: ""
    WF_DELAY_MS: ""
    WF_FANOUT_WIDTH: ""
    WF_FANOUT_MODE: ""
    WF_FAILURE_RATE: ""
    WF_SIGNAL_TIMEOUT_MS: ""
    WF_SIGNAL_DELAY_MS: ""
    WF_SIGNAL_SKIP_RATIO: ""
    WF_RETRY_MAX: ""
    WF_RETRY_BACKOFF_MS: ""
    WF_SEED_VERSION: ""
  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 256Mi

# The workflow engine's HOST knobs (#297) — `src/workflow/config.ts` and
# `src/actors.app.ts` document each. EMPTY omits the variable, so a
# deployment setting none of these is byte-identical to one that predates
# the engine; every one that IS set reaches INFRA_SHAPE.
workflow:
  env:
    WF_TIMER_THRESHOLD_MS: ""
    WF_REMINDER_TICK_MS: ""
    WF_IDLE_AFTER_MS: ""
    WF_DEACTIVATE_ON_SLEEP: ""
    WF_STALE_WAKE_MS: ""
    WF_CHILD_STALE_MS: ""
    WF_STATS_SAVE_EVERY: ""
    WF_STATS_RING: ""
    WF_NOTIFY_RETRY_MS: ""
    WF_COMPUTE_MAX_LOCAL: ""
    WF_IO_MAX_LOCAL: ""
    WF_CALL_TIMEOUT_MS: ""
    # Admission caps (#384): per-actor queue and host-wide in-flight turns.
    WF_MAX_QUEUED: ""
    WF_MAX_INFLIGHT_TURNS: ""

# The WebSocket load generator (#172) — connections held and messages
# delivered, rather than ops/s. Rendered per run exactly like `loadgen`.
wsLoadgen:
  enabled: false
  # Jobs are immutable — a unique suffix per run.
  nameSuffix: ""
  # Pods. Indexed completion, so pod 0 is the publisher and the only one
  # carrying latency probes; the rest are pure subscriber capacity. More
  # than one pod is how you get past a single pod's ~28k ephemeral ports
  # to one destination.
  parallelism: 1
  backoffLimit: 0
  # idle | hot | spread | calls
  mode: hot
  # Connection rungs, e.g. "1000,5000,10000". Empty uses `connections`.
  ladder: ""
  connections: 1000
  # Distinct Fanout keys in `hot` mode — the fan-out width.
  actors: 1
  subsPerConn: 1
  # current (identity-blind, one shared watch loop) | mine (per principal)
  # current (identity-blind, undeclared) | shared (the same read, declared
  # principalIndependent — #138) | mine (per principal)
  read: current
  # anon | per-user — requires socket.sessions=true on the host.
  principal: anon
  # The slow-consumer arm (#182). `slowFraction` of subscribers STOP READING
  # their socket `slowAfterS` seconds after the rung seeds, which is what
  # makes the host's send buffer grow — nothing in the runtime reads
  # `bufferedAmount`. 0 disables it, which is every other scenario.
  # `slowResumeMs` > 0 duty-cycles instead of stalling outright.
  slowFraction: 0
  slowAfterS: 5
  slowResumeMs: 0
  publishRate: 10
  payloadBytes: 0
  persist: "0"
  durationS: 30
  probes: 20
  connectBatch: 250
  # Per-connection dial+seed deadline. Short values make a rung that cannot
  # dial fail fast instead of hanging for its whole window — which is what
  # the identity-cliff scenario wants, since the failure IS its measurement.
  connectTimeoutS: 30
  keyPrefix: fan
  # Default: the host service in-namespace.
  targetUrl: ""
  # A subscriber pod is mostly memory: ~80 KB of client heap per connection
  # in local measurement, so 10k connections needs real headroom. Too small
  # a limit produces an OOMKill that reads exactly like a server-side
  # ceiling, which is the most expensive way to be wrong here.
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1800m
      memory: 2Gi
