# The public edge, deliberately TWO Ingress objects on one host: annotations
# in ingress-nginx are per-Ingress, and the actor endpoint needs one the
# rest of the site must NOT have (see below).
#
# TLS comes from the controller's default certificate (a wildcard for the
# deployment's DNS zone) — no tls block, no cert-manager annotation needed
# for a host the wildcard covers.
#
# Shared annotations, load-bearing for the live connection:
# - proxy-buffering off: the `$live` subscribe response is long-lived
#   NDJSON; buffered, the page silently stops being live.
# - read/send-timeout 3600: belt and braces. Both stream mounts now emit a
#   keepalive every 30s (`$live` in-band, per-actor streams at the byte
#   layer), which is what actually keeps a quiet connection alive through
#   hops nobody here controls; the long timeout makes a drop rarer still on
#   the hop we do control, and the client reconnects either way.
# - NO rewrite/regex annotations of any kind: an actor symbol is now
#   several real path segments (/_sigx/actor/Room/watch) and the routing
#   token beside it is still percent-encoded (/_sigx/actor/r/tenant%2Fa/...).
#   A rewriting location may merge segments, resolve dot segments, or decode
#   the token's %2F — each of which breaks routing.
{{- if not .Values.ingress.host }}
{{- fail "ingress.host is required — an empty Ingress host silently matches EVERY hostname the controller serves" }}
{{- end }}
{{- $ann := dict
  "nginx.ingress.kubernetes.io/proxy-buffering" "off"
  "nginx.ingress.kubernetes.io/proxy-request-buffering" "off"
  "nginx.ingress.kubernetes.io/proxy-read-timeout" "3600"
  "nginx.ingress.kubernetes.io/proxy-send-timeout" "3600" }}
{{- $locality := dig "localityRouting" true (.Values.ingress | default dict) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "chat.fullname" . }}-web
  labels:
    {{- include "chat.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $ann | nindent 4 }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # SSR documents, assets and serverFns: plain round-robin. These
          # carry NO routing token, so hashing them would hash the empty
          # string and pin every page render onto a single host.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "chat.fullname" . }}-host
                port:
                  name: public
{{- if $locality }}
          # `$live` (and any other `$`-reserved symbol) is the ONE actor path
          # that must stay off the hash: one held-open response fans out to
          # many actors, so the runtime deliberately sends no token — and an
          # empty hash key pins every live subscription in the deployment
          # onto a single host on a controller without the `$sigx_hash` map
          # (see (3) below). A longer prefix wins in nginx, so this carves it
          # back out of the hashed Ingress below and keeps it round-robin
          # either way. (Every open room page holds one — `Room.tsx` puts
          # three live subscriptions on a single connection — so this rule
          # is load-bearing rather than defensive, and the infra suite
          # asserts it.)
          # ImplementationSpecific, NOT Prefix: `$` is rejected by the
          # ingress-nginx admission webhook in a Prefix path ("cannot be
          # used with pathType Prefix"), which neither `helm lint` nor
          # `helm template` can see — only a real apply does.
          - path: /_sigx/actor/$live
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "chat.fullname" . }}-host
                port:
                  name: public
{{- end }}
{{- if $locality }}
---
# The actor endpoint ONLY: hash each call to the host that owns the actor.
# Every actor request carries the routing token in `x-sigx-actor-route`
# (and in the path), so a consistent hash on it PLUS `preferLocalPolicy()`
# in the app makes the edge and the cluster agree on one owner per key —
# the documented composition, measured at 1.00 local fraction against 0.01
# for round-robin. Neither half works alone. `$live` and other reserved
# symbols carry no token and keep paying a hop by design.
#
# The key is `$sigx_hash`, NOT the header itself: a `map` on the controller
# turns an EMPTY header into `$request_id` (see (3) below) so a call with
# no token spreads instead of pinning. `$live` is carved out by path above
# regardless; the map is what covers every other untokened call.
#
# ⚠ THREE SEPARATE THINGS SILENTLY DEFEAT THIS ANNOTATION. The first two
# were observed live on ingress-nginx v1.15.1, and either one alone gives
# you round-robin; the third pins traffic onto ONE pod.
#
# (1) THE CONTROLLER STRIPS THE VALUE ON >= 1.12. Its value is an nginx
# variable, which rates `upstream-hash-by` as Critical risk, and the
# annotation risk level has defaulted to `High` since 1.12 — so the
# controller strips the VALUE, leaves this object exactly as written, logs
# nothing, and load-balances round-robin. Every actor call then lands on a
# random host and pays a hop.
#
# Measured on v1.15.1 over 7 hosts: 40 requests carrying ONE token spread
# 6/6/6/5/6/0/6, the owning host received none of them from the edge, and
# `infra/locality-ab` reported token_speedup 0.99 — which reads like a
# finding about locality rather than a broken deployment. Confirmed in the
# controller's own programmed backend, where the value is simply absent:
#     upstreamHashByConfig: {"upstream-hash-by-subset-size":3}
#     loadBalancing: round_robin
#
# The fix is cluster-wide, so it is not one to flip casually on a shared
# ingress, and a chart cannot set it either way. It is a controller
# ConfigMap option, **NOT** a CLI flag — `--annotations-risk-level=Critical`
# as a Deployment arg crash-loops v1.15.1 with `unknown flag`:
#
#     kubectl -n ingress-nginx patch configmap ingress-nginx-controller \
#       -p '{"data":{"annotations-risk-level":"Critical"}}'
#     kubectl -n ingress-nginx rollout restart deploy/ingress-nginx-controller
#
# The restart is required: a running controller does not re-read that key.
# See the RUNBOOK's one-time setup (`perf/aks/deploy/RUNBOOK.md` §0).
#
# (2) A SHARED BACKEND DROPS IT EVEN ONCE (1) IS FIXED. `upstream-hash-by`
# is BACKEND-level configuration and ingress-nginx keys backends by
# service+port — so while this hashed Ingress and the deliberately
# un-hashed web Ingress above both pointed at `-host:public`, they were one
# backend and the hash-less Ingress won the merge. Proven live: deleting
# the web Ingress made `upstream-hash-by: $http_x_sigx_actor_route` appear
# in the programmed backend immediately, and restoring it removed it again.
# Hence the backend below is `-host-actor` — a second Service over the same
# pods, existing only to own a backend of its own. It is defined in
# `host-actor-service.yaml`, under the same `localityRouting` toggle.
#
# (3) AN EMPTY KEY HAS NO FALLBACK. ingress-nginx's consistent hash is a
# Lua balancer, and unlike nginx core `hash`, HAProxy `balance hdr` or
# Envoy's ring hash it does NOT fall back to round-robin when the key is
# empty — it hashes "" and sends everything to whichever pod that lands
# on. A `defineWorker` call carries no token since #148 (no `/r/{token}/`
# segment, no header — a worker is local on every host, so there is
# nothing to route to), and its path (`/_sigx/actor/Digest/summarize`) is
# indistinguishable from a stateful call, so it cannot be carved out the
# way `$live` is. Hashing the header directly therefore put EVERY worker
# call, for every key, on ONE pod (#342) — `pool_spread` ~1 however many
# hosts there are.
#
# Hence `$sigx_hash`: an nginx `map` that substitutes `$request_id` (a
# random 32-hex per request) for an empty header and passes a real token
# through untouched. A `map` is `http`-context config, so — like the risk
# level in (1) — a chart cannot set it; it is the controller ConfigMap's
# `http-snippet`, one more line of the RUNBOOK's §0:
#
#     map $http_x_sigx_actor_route $sigx_hash {
#         ""      $request_id;
#         default $http_x_sigx_actor_route;
#     }
#
# ⚠ WITHOUT THE MAP THIS CHART IS WORSE THAN ROUND-ROBIN. An nginx
# variable no `map` defines is nil in Lua, the balancer hashes the empty
# string, and EVERY actor call — tokened or not — lands on one pod. Do
# not deploy this chart against a controller whose §0 is incomplete; the
# RUNBOOK's verify step greps the programmed nginx.conf for the map.
#
# `infra.test.ts` asserts both halves: one token pins to one host, and
# distinct tokens reach more than one — so (1), (2) or (3) is loud instead
# of quietly costing you the locality half (or the whole fleet).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "chat.fullname" . }}-actor
  labels:
    {{- include "chat.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $ann | nindent 4 }}
    nginx.ingress.kubernetes.io/upstream-hash-by: "$sigx_hash"
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /_sigx/actor
            pathType: Prefix
            backend:
              service:
                name: {{ include "chat.fullname" . }}-host-actor
                port:
                  name: public
{{- end }}
