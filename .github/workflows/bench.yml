name: Bench

# Two kinds of number, gated completely differently — the split is the whole
# design, and it is enforced in code (`Metric.exact`), not by this comment.
#
# - **Timings are informational.** Numbers off a shared CI runner are too noisy
#   to gate on: measured on two IDENTICAL commits, this workflow reported
#   regressions of 16%, 19% and 53%. All false. So no timing move, however
#   large, fails anything here.
#
#   The `pull_request` A/B now runs on a DEDICATED machine instead (four real
#   cores, no SMT; THP and swap off; the OS pinned to core 0 and the benchmark
#   to cores 1-3). Three back-to-back runs of the sibling repo's quick suite on
#   it put every timing row above ~0.1 ms within 0.45-4.1%. That is what makes
#   the timing half worth reading. It does NOT yet make it worth gating:
#   BENCH_THRESHOLD stays at 25 until we have enough runs on the new box to
#   measure the real variance floor and lower it to a number we can defend.
#   Tightening it on the strength of "the hardware is better now" would be
#   exactly the guess this comment block exists to prevent.
# - **Exact metrics gate, at zero tolerance.** Directory calls per activation,
#   microtask turns per dispatch, notifications per join — invariants, not
#   measurements. In that same identical-commit run every one came back
#   bit-identical while 215 other metrics drifted. A shared runner judges these
#   exactly as well as a quiet desk does, so an extra directory round-trip
#   fails the check and should.
#
# (A scenario that THROWS also still fails the step: a benchmark that cannot
# prove it did its work must not report a number.)
#
# Two jobs, two shapes:
#
# - `bench-ab` (perf-sensitive PRs, and dispatches carrying a `base`): the
#   two refs measured in INTERLEAVED, COUNTERBALANCED rounds on one runner
#   (#98, ported from core#639) — even rounds base-first, odd rounds
#   head-first, so drift carries equal and opposite bias in the two orders
#   and cancels in the paired deltas instead of accruing to whichever side
#   ran second (sequentially, that order was worth a measured ~+2% to the
#   head). The report is a VERDICT per row: `improved`/`regressed` needs
#   every round to agree in sign AND a median delta above both a 3% floor
#   and the row's own run-to-run spread; a row that swings more than 10%
#   reads `noisy` and claims nothing. The merge-queue leg stays sequential
#   on the gate scenarios — `exact` metrics are invariants and rounds add
#   nothing they can fail on. `pnpm bench:compare` diffs against
#   `benchmarks/baselines/local.json`, which is per-machine and gitignored
#   precisely because someone else's laptop is not evidence; CI has no such
#   baseline and could not trust one if it did (the calibration probe would
#   differ and every verdict would come back "no verdict").
# - `bench-quick` (manual, no `base` input): one run of the current ref,
#   uploaded as an artifact for a human to read.
#
# To judge a perf question between any two refs on the quiet VM — before a
# PR exists, or re-litigating a flagged row with more rounds:
#
#   gh workflow run bench.yml -f base=<ref> -f head=<ref> -f rounds=7
#
# (`-f enforce=true` additionally fails the run on a unanimous timing
# regression — the deliberate proof run; the PR path never gates timings.)
#
# An exact-metric regression FAILS this workflow, so the check goes red. It is
# not yet a *required* check — this repo has no ruleset — so red is a stop sign
# rather than a lock. It now runs on `merge_group` too, which was the blocking
# prerequisite: a required check that never reports on the queue ref leaves the
# PR waiting forever on a context that will not arrive, and `gh pr checks` shows
# nothing wrong. What remains before promoting it is judgement, not plumbing —
# give the gate a few PRs, because one that fires on noise once costs more trust
# than a hundred green runs earn.
#
# THE QUEUE RUN IS DELIBERATELY NARROWER. `merge_group` does not support `paths`
# filters, so it fires on every queued merge including docs-only ones. Running
# the whole ~7-minute suite there would tax every merge to re-measure timings
# that cannot fail anything. So the queue measures only the scenarios carrying
# `exact` metrics — which is exactly the set that can fail — and the full A/B
# stays on `pull_request`, where the paths filter applies and a human reads it.
#
# Tier 2 (`BENCH_TIER2=1`, a forked process per host) stays out — it wants
# a quiet machine with spare cores.
on:
  workflow_dispatch:
    inputs:
      base:
        description: >-
          Base ref for an interleaved A/B on the bench VM. Leave empty for a
          plain full-suite measurement of the dispatched ref (bench-quick).
          A branch, tag or FULL sha — actions/checkout rejects short shas
          for `head`, so use full ones for both (#141).
        required: false
        default: ''
      head:
        description: >-
          Head ref for the A/B (defaults to the dispatched ref). Branch, tag
          or FULL sha.
        required: false
        default: ''
      rounds:
        description: 'Interleaved A/B rounds (sign test at p = 2^-rounds)'
        required: false
        default: '5'
      enforce:
        description: 'Also FAIL the run on a unanimous timing regression'
        required: false
        default: false
        type: boolean
  merge_group:
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'benchmarks/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/bench.yml'
      # Docs cannot move a number, and `packages/**`/`benchmarks/**` otherwise
      # match every README, CHANGELOG and BASELINES.md under them — which put a
      # six-file Markdown PR on the dedicated bench machine for a full A/B.
      # GitHub applies these in order, so the trailing negation wins for .md
      # while a PR touching source AND docs still matches on the source path.
      # `merge_group` takes no paths filter, so the gating `exact` metrics are
      # unaffected: this only changes which PRs get the timing comment.
      - '!**/*.md'

permissions: {}

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  # One knob, applied to BOTH halves of the A/B — they are only comparable if
  # they measured the same way. 3 rounds is the local default, and rounds are
  # interleaved across scenarios precisely so a runner that drifts mid-suite
  # does not dump all of it on whichever scenario ran last.
  #
  # Everything else is left at its default ON PURPOSE, so a PR comment
  # describes the same measurement `pnpm bench` makes: no scenario filter (the
  # whole Tier-1 suite, ~4 min a half locally — the `mem/` leak scenarios are
  # only ~15% of that, and a leak arriving in a PR is worth catching) and no
  # --quick (1 round of 150ms cannot separate a change from the noise).
  BENCH_RUNS: '3'
  # The comparison threshold, and the ONE number that differs from the local
  # default of 10%. Not a laxer rule — a different measurement condition,
  # measured rather than guessed.
  #
  # The first real A/B on this workflow compared two commits with no runtime
  # change at all (the PR that added the workflow) and reported one 🔴
  # regression and four 🟢 improvements, spanning 10.1% to 18.7%. All were
  # false. The per-metric noise gate estimates noise from the spread across
  # rounds INSIDE one process; two processes minutes apart on a shared 2-vCPU
  # runner vary by considerably more than that, and a metric that happened to
  # be steady within each half slips through. A suite that cries wolf gets
  # ignored, so the CI floor sits above the false positives it actually
  # produced.
  #
  # A quiet local machine keeps the 10% default — `pnpm bench:compare` is
  # unchanged. This buys the reduction in false alarms by giving up real moves
  # under 25%, which is the correct trade for an advisory comment: anything
  # smaller has to be reproduced locally anyway.
  BENCH_THRESHOLD: '25'
  # The scenarios that carry `exact` metrics, and so the only ones whose
  # outcome can fail a check. The merge queue measures these and nothing else;
  # a `pull_request` run passes no filter and measures everything.
  #
  # Keep in step with the `exact: true` flags — a scenario flagged but missing
  # here is simply not gated on the queue, silently. `pnpm bench:run --list`
  # names them; `grep -rn 'exact: true' benchmarks/src/scenarios` is the check.
  BENCH_GATE_SCENARIOS: 'dispatch/warm-turns dispatch/warm-turns-deadline dispatch/always-warm-turns dispatch/stateless-pool-cap cluster/membership-fanout cluster/directory-ops-per-activation cluster/stateless-directory-ops cluster/locality-routed cluster/locality-warm topics/fanout cluster/live-fanout live/principal-fanout'

jobs:
  # Starts the dedicated bench machine, which sits powered down between runs so
  # compute is billed only while a benchmark is actually running.
  #
  # Runs on EVERY event so the bench jobs can `needs:` it unconditionally — the
  # cloud steps are what is conditional, and a job whose only steps are skipped
  # still succeeds, so the queue leg and fork PRs pass through it in seconds.
  #
  # It WAITS for the machine rather than firing and forgetting. `timeout-minutes`
  # does not apply to a job still QUEUED for a runner label that never appears:
  # that clock starts only once a runner picks the job up. An unavailable machine
  # would therefore leave the PR pending until GitHub's 24-hour unpicked-job
  # limit, with nothing in the log saying why. Blocking here costs ~45s of hosted
  # time and turns that into an immediate, visible failure.
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # OIDC only — no client secret exists for this identity to leak.
      id-token: write
      contents: read
    steps:
      # Fork PRs are excluded for the same reason they are excluded from
      # `runs-on` below, and they cannot read secrets anyway, so this would fail
      # confusingly rather than cleanly.
      #
      # DEPENDABOT is excluded for a related but distinct reason. Its PRs come
      # from a branch IN this repo, so the fork test above passes them — but a
      # Dependabot-triggered run gets a read-only token and cannot see regular
      # Actions secrets (they live in a separate Dependabot store). Without this
      # clause every dependency bump would fail `wake` on empty credentials and
      # paint a red X on a PR that has no business touching the bench machine.
      # This repo gets a lot of them.
      #
      # These conditions are written to FOLD to a single line — no continuation
      # is indented past the first. A more-indented line in a `>-` scalar keeps
      # its newline, and the expression then reaches Actions with a literal
      # newline inside it.
      - uses: azure/login@v2
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]')
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Starting an already-running machine is a successful no-op, so concurrent
      # PRs racing to wake the same box is fine.
      - name: Start the bench machine
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]')
        env:
          RG: ${{ secrets.AZURE_RG }}
          VM: ${{ secrets.AZURE_VM_NAME }}
        run: |
          az vm start -g "$RG" -n "$VM"
          state=$(az vm get-instance-view -g "$RG" -n "$VM" \
            --query "instanceView.statuses[?starts_with(code,'PowerState/')].code | [0]" -o tsv)
          echo "power state: $state"
          [ "$state" = "PowerState/running" ] || {
            echo "::error::Bench machine did not reach a running state ($state)."
            exit 1
          }

  bench-quick:
    if: github.event_name == 'workflow_dispatch' && inputs.base == ''
    needs: wake
    # `workflow_dispatch` requires write access on a branch of this repo, so
    # there is no fork exposure here and this can take the dedicated runner
    # unconditionally.
    runs-on: [self-hosted, linux, x64, bench]
    timeout-minutes: 45
    # The workflow-level `permissions: {}` leaves a job with a token that
    # cannot even clone unless it asks for this.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v6
        with:
          # The benchmarks run erasable TS directly through `node` (native type
          # stripping), which needs >= 22.18.
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # By path, with --conditions=production, so this measures the built prod
      # dist — the same thing `pnpm bench:run` measures.
      - name: Bench (informational)
        run: |
          node --conditions=production --expose-gc benchmarks/src/main.ts \
            --runs="$BENCH_RUNS" --json="$RUNNER_TEMP/bench.json"

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: ${{ runner.temp }}/bench.json

  bench-ab:
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'merge_group' ||
      (github.event_name == 'workflow_dispatch' && inputs.base != '')
    needs: wake
    # WHERE THIS RUNS IS THE WHOLE POINT, and the three cases differ:
    #
    # - `pull_request` from a branch of this repo → the dedicated bench machine.
    #   This is the leg that measures TIMINGS, and timings off a shared 2-vCPU
    #   runner are worthless: on two identical commits this workflow reported
    #   16%, 19% and 53% regressions, all false. The machine has four real cores
    #   with no SMT sibling to contend with (vCPUsPerCore=1 — every D*_v6 SKU
    #   reports 2), THP and swap off, the apt/man-db/fstrim timers disabled, and
    #   cgroup pinning that keeps the OS on core 0 and the benchmark on 1-3.
    #
    # - `merge_group` → stays on `ubuntu-latest`, deliberately. The queue leg
    #   measures only BENCH_GATE_SCENARIOS, and those carry `exact` metrics —
    #   invariants, not measurements, identical on any machine. They gate just as
    #   well on a shared runner, so there is nothing to gain, and pinning a merge
    #   gate to a single machine means an outage wedges the queue.
    #
    # - `pull_request` from a FORK → `ubuntu-latest`, non-negotiable. Fork PRs
    #   run the workflow file FROM THE FORK, so a self-hosted runner on a public
    #   repo is arbitrary code execution on our infrastructure. Forks still get
    #   their A/B, on the shared box, which is what they had before.
    #
    # - `pull_request` from DEPENDABOT → `ubuntu-latest` too. Those PRs are
    #   same-repo so the fork test passes them, but their runs get a read-only
    #   token and no Actions secrets, so `wake` cannot start the machine — and a
    #   dependency bump does not need the quiet box anyway.
    #
    # - `workflow_dispatch` with a `base` → the bench machine, like
    #   `bench-quick`: dispatching requires write access on a branch of this
    #   repo, so there is no fork exposure.
    #
    # Kept on ONE line on purpose: in a YAML folded scalar (`>-`) a line indented
    # further than the first is preserved verbatim, newline and all, so the
    # pretty-wrapped version of this expression reaches Actions with literal
    # newlines inside it.
    runs-on: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && fromJSON('["self-hosted","linux","x64","bench"]') || 'ubuntu-latest' }}
    # Two installs, two builds and two full suites. The ceiling is for a hang,
    # not for a slow run.
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    env:
      # Each event names its own sides: a PR/queue run compares its base and
      # head shas; a dispatch compares the two refs it was given. At most one
      # source is ever non-empty per event.
      BASE_SHA: ${{ inputs.base || github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      HEAD_SHA: ${{ inputs.head || github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      AB_ROUNDS: ${{ inputs.rounds || '5' }}
      AB_ENFORCE: ${{ inputs.enforce || 'false' }}
    steps:
      # fetch-depth 0: the base side is materialized from this clone (a
      # worktree on the interleaved path, an in-place checkout on the queue
      # path), so both commits must be in it.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.head || github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      # ------------------------------------------------------------------
      # The MERGE QUEUE path: sequential, gate scenarios only, unchanged.
      # Deliberately NOT interleaved: the queue measures only `exact`
      # metrics, which are invariants — identical on any machine, in any
      # order, in one pass — so rounds would multiply its wall-clock for
      # statistics nothing there can use.
      #
      # Both halves invoke benchmarks/src/main.ts BY PATH, never through a
      # pnpm script: the base ref is an arbitrary older commit and need not
      # define a script name this PR introduces. For the same reason they
      # pass only flags the base ref already understands — main.ts throws on
      # an unknown one. $BENCH_GATE_SCENARIOS is unquoted so the words split
      # into separate filters.
      - name: Bench the base ref (queue)
        if: github.event_name == 'merge_group'
        run: |
          git checkout --detach "$BASE_SHA"
          pnpm install --frozen-lockfile
          pnpm build
          node --conditions=production --expose-gc benchmarks/src/main.ts \
            $BENCH_GATE_SCENARIOS --runs="$BENCH_RUNS" --json="$RUNNER_TEMP/base.json"

      - name: Bench the head ref (queue)
        if: github.event_name == 'merge_group'
        run: |
          git checkout --detach "$HEAD_SHA"
          # A dist left over from the base build is not overwritten when the
          # head build no longer emits that file — the head half must measure
          # the head's output and nothing else.
          rm -rf packages/*/dist
          pnpm install --frozen-lockfile
          pnpm build
          node --conditions=production --expose-gc benchmarks/src/main.ts \
            $BENCH_GATE_SCENARIOS --runs="$BENCH_RUNS" --json="$RUNNER_TEMP/head.json"

      # The HEAD checkout's comparer, so a PR that changes the comparison rules
      # is read by the version it ships.
      #
      # `continue-on-error` is NOT indifference: the comparer exits 1 when an
      # exact metric regressed, and if that ended the job here the comment
      # explaining WHY would never post. So the failure is captured, the
      # report goes out, and the last step re-raises it.
      - name: Compare (queue)
        if: github.event_name == 'merge_group'
        id: compare
        continue-on-error: true
        run: |
          node --conditions=production benchmarks/src/compare-files.ts \
            --before="$RUNNER_TEMP/base.json" \
            --after="$RUNNER_TEMP/head.json" \
            --threshold="$BENCH_THRESHOLD" \
            --markdown="$RUNNER_TEMP/bench.md" \
            --title="base \`${BASE_SHA:0:7}\` (before) → head \`${HEAD_SHA:0:7}\` (after), both measured on this runner. The head half is always measured second; across all throughput metrics that order is worth about +2%."

      # ------------------------------------------------------------------
      # The PR and DISPATCH path: interleaved, counterbalanced rounds (#98).
      # Both refs exist simultaneously — the head is this checkout, the base
      # a worktree — so rounds can alternate without re-installing. Rounds
      # replace in-process repetition (--runs stays at ab.ts's default of 1
      # per side per round): the verdict's statistics come from BETWEEN-round
      # spread and a sign test, which is what the sequential job's
      # measured-and-documented "+2% because the head runs second" bias
      # cannot contaminate.
      - name: Prepare the base checkout
        if: github.event_name != 'merge_group'
        run: |
          # The bench VM persists the workspace between runs, and the runner
          # wipes RUNNER_TEMP — leaving a stale worktree REGISTRATION behind
          # that would fail the add below.
          git worktree prune
          # Resolve whatever kind of ref the dispatch named. checkout ran
          # with fetch-depth 0 but fetch-tags off, so a sha or local ref
          # resolves directly, a branch name via origin/ — and anything else
          # a dispatch can name (a tag, refs/pull/N/head, a full refname) is
          # fetched explicitly before giving up.
          BASE_COMMIT=$(git rev-parse --verify --quiet "$BASE_SHA^{commit}" \
            || git rev-parse --verify --quiet "origin/$BASE_SHA^{commit}" \
            || { git fetch --quiet origin "$BASE_SHA" \
                 && git rev-parse --verify "FETCH_HEAD^{commit}"; })
          git worktree add "$RUNNER_TEMP/base" "$BASE_COMMIT"
          cd "$RUNNER_TEMP/base"
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build the head
        if: github.event_name != 'merge_group'
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # A dispatch may name a HEAD that predates the A/B tooling itself —
      # the first real use did (#141): re-judging a flagged row from a
      # pre-port PR. The measurement only needs each side's own main.ts;
      # the driver and reporter come from the workflow's own ref when the
      # checkout lacks them. Their `report.ts`/`types.ts` imports resolve
      # on any ref this can sensibly target, and if a ref is old enough
      # that they don't, the step that follows fails loudly rather than
      # measuring the wrong thing. The origin/main fallback covers the PR
      # event, where GITHUB_SHA is a merge commit this clone never fetched
      # — reached only for a PR whose branch forked before the port.
      - name: Materialize the A/B driver
        if: github.event_name != 'merge_group'
        run: |
          # fetch-depth 0 brings every branch head, which covers GITHUB_SHA
          # on a dispatch (the dispatched ref's tip) — but only as long as
          # that stays true of checkout's refspec, so fetch it explicitly,
          # best-effort, before relying on it.
          git fetch --quiet origin "$GITHUB_SHA" 2>/dev/null || true
          for f in ab.ts ab-verdict.ts ab-report.ts; do
            if [ ! -f "benchmarks/src/$f" ]; then
              git show "$GITHUB_SHA:benchmarks/src/$f" > "benchmarks/src/$f" 2>/dev/null \
                || git show "origin/main:benchmarks/src/$f" > "benchmarks/src/$f"
              echo "materialized benchmarks/src/$f from the workflow ref"
            fi
          done

      - name: Interleaved rounds
        if: github.event_name != 'merge_group'
        run: |
          node --conditions=production --expose-gc benchmarks/src/ab.ts \
            --base-dir="$RUNNER_TEMP/base" --head-dir="$PWD" \
            --rounds="$AB_ROUNDS" --out="$RUNNER_TEMP/rounds.json"

      - name: Verdict
        if: github.event_name != 'merge_group'
        id: verdict
        continue-on-error: true
        run: |
          ENFORCE=""
          [ "$AB_ENFORCE" = "true" ] && ENFORCE="--enforce"
          node --conditions=production benchmarks/src/ab-report.ts \
            --rounds-file="$RUNNER_TEMP/rounds.json" \
            --markdown="$RUNNER_TEMP/bench.md" \
            $ENFORCE \
            --title="base \`$(git -C "$RUNNER_TEMP/base" rev-parse --short HEAD)\` (before) → head \`$(git rev-parse --short HEAD)\` (after), $AB_ROUNDS interleaved rounds on this runner."

      - name: Job summary
        run: cat "$RUNNER_TEMP/bench.md" >> "$GITHUB_STEP_SUMMARY"

      # Fork PRs get a read-only token on `pull_request`, so the comment call
      # would 403. The job summary above still carries the report for those,
      # as it does for the merge queue, where there is no PR to comment on and
      # `context.payload.pull_request` would be undefined.
      - name: Comment on the PR
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- sigx-actors-bench-ab -->';
            const body = marker + '\n' + fs.readFileSync(process.env.RUNNER_TEMP + '/bench.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            // One comment per PR, updated in place — a push should refresh the
            // numbers, not bury the thread under a new table each time.
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # The gate, re-raised now that the comment and the summary are out.
      # Only an exact-metric class reaches here off the PR path — regressed,
      # or nondeterministic between rounds of the same code — plus, on a
      # dispatch with `enforce`, a unanimous timing regression. A timing
      # move on the PR path, however large, left its reporter at exit 0.
      - name: Fail on a gated regression
        if: steps.compare.outcome == 'failure' || steps.verdict.outcome == 'failure'
        run: |
          echo "::error::The A/B gate failed — see the Benchmark A/B report." \
            " Exact metrics are invariants (directory calls per activation, microtask" \
            " turns per dispatch): the same code gives the same value on any machine," \
            " so a move there is a behavioural change rather than runner noise — and" \
            " one that VARIES between rounds of the same code has broken the exact" \
            " contract outright. If the change is intended, say so in the PR."
          exit 1

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-ab-results
          path: |
            ${{ runner.temp }}/base.json
            ${{ runner.temp }}/head.json
            ${{ runner.temp }}/rounds.json
            ${{ runner.temp }}/bench.md
          if-no-files-found: ignore
