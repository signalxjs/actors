# This workflow publishes to npm via trusted publishing
# (OIDC). It expects `scripts/publish.js` (publishes the repo's package(s) in
# dependency order) and `scripts/verify-pack.js`. Copy both from signalxjs/core
# as a starting point, or replace the "Publish to npm" / "Verify pack" steps
# with your own. Configure trusted publishing per-package on npmjs.com first.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Top-level permissions are intentionally minimal. Each job declares what it
# actually needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    # OIDC for npm trusted publishing; read-only on contents.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # npm trusted publishing needs npm >= 11.5.1. Node 24 ships npm 11.x,
      # but pin to latest so we never silently fall behind a publish-side fix.
      - name: Upgrade npm
        run: npm install -g npm@latest

      # Before anything else: the tag has to describe what is actually in the
      # tree. `publish.js` reads versions from package.json and SKIPS what is
      # already on the registry, so pushing v0.2.0 with manifests still at
      # 0.1.0 publishes nothing, exits 0, and produces a GitHub Release named
      # v0.2.0 with no packages behind it. Failing here is the difference
      # between a mistake and a mystery.
      - name: Tag matches the manifests
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="${TAG#v}"
          fail=0
          for pkg in packages/*/package.json; do
            private=$(node -p "require('./$pkg').private === true")
            [ "$private" = "true" ] && continue
            got=$(node -p "require('./$pkg').version")
            name=$(node -p "require('./$pkg').name")
            if [ "$got" != "$want" ]; then
              echo "::error file=$pkg::$name is $got but the tag says $want"
              fail=1
            fi
          done
          if [ "$fail" = "1" ]; then
            echo "Run \`pnpm version:set $want\`, commit, then re-tag."
            exit 1
          fi
          echo "All publishable packages are at $want."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Verify pack
        run: pnpm verify:pack

      - name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: node scripts/publish.js --provenance

  github-release:
    needs: publish-npm
    runs-on: ubuntu-latest
    # Only this job needs write — npm publish already happened above.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q true; then
            gh release edit "$TAG" --draft=false --latest
          else
            gh release create "$TAG" --generate-notes --latest
          fi
