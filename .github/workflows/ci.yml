name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only, explicitly. Without a block a workflow inherits the org default,
# which can be write-all — and this one checks out and executes untrusted PR
# code (`pnpm install`, `build`, `test`, and `verify:pack`, which shells out to
# `npm install`). Nothing here needs to write anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: ['20', '22']
        include:
          - os: windows-latest
            node-version: '22'
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Every core dep must flow through a single-minor catalog (one hoisted
      # copy). Cheap static check; fails fast before build/test.
      - name: Verify catalog
        run: pnpm verify:catalog

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  # The @sigx/actors-redis provider suite is env-gated on REDIS_URL; only
  # this job provides it (the main matrix, incl. Windows, skips cleanly).
  test-redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test against Redis
        run: pnpm test actors-redis workflow-cluster-redis
        env:
          REDIS_URL: redis://localhost:6379

  # The @sigx/actors-pg provider suite is env-gated on PG_URL; only this
  # job provides it (the main matrix, incl. Windows, skips cleanly).
  test-pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test against Postgres
        run: pnpm test actors-pg
        env:
          PG_URL: postgres://postgres:postgres@localhost:5432/postgres

  # The @sigx/actors-surreal provider suite is env-gated on SURREAL_URL; only
  # this job provides it (the main matrix, incl. Windows, skips cleanly).
  #
  # A `services:` container CANNOT work here, unlike postgres/redis above: the
  # image is `ENTRYPOINT ["/surreal"]` with no CMD, and the services schema
  # offers no way to pass the `start` subcommand — a bare service entry runs
  # `/surreal` with no arguments and exits. Hence an explicit `docker run`.
  test-surreal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start SurrealDB 3
        run: |
          docker run -d --name surrealdb -p 8000:8000 \
            surrealdb/surrealdb:v3.2.4 \
            start --bind 0.0.0.0:8000 --username root --password root memory
          # /ready is the true startup probe (3.2.0+); /health only reports
          # the storage engine.
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/ready > /dev/null && break
            sleep 1
          done
          curl -s http://127.0.0.1:8000/version

      - name: Test against SurrealDB
        run: pnpm test actors-surreal
        env:
          SURREAL_URL: ws://127.0.0.1:8000
          SURREAL_USER: root
          SURREAL_PASS: root

  # Own job, like test-redis, and for the same kind of reason: wrangler
  # declares engines.node >= 22 and the main matrix includes Node 20, so this
  # suite cannot run there. Ubuntu only — workerd's semantics do not vary by
  # host OS, and the Windows leg is already the slowest.
  test-workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test against workerd
        run: pnpm test:workers

  verify-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pack
        run: pnpm verify:pack

  # The repo was promoted from a private tracker and the `#N` numbers came
  # with it; some now land on real but unrelated public issues, which reads
  # as plausible and is false. Its own job, not a matrix step: it calls the
  # GitHub API, so running it three times per push buys nothing.
  issue-refs:
    runs-on: ubuntu-latest
    # Explicit, though `contents: read` already reaches a public repo's issues:
    # the whole job is a no-op if the token cannot read them, and that would
    # show up as a green check rather than a failure.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # --require-api: both checks need the issue list, so an unreachable API
      # means nothing was checked. Locally that is a warning; here it fails.
      - name: Check issue references
        run: node scripts/check-issue-refs.mjs --require-api
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
