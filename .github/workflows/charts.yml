# The gate that `helm lint` cannot be.
#
# A chart that renders perfectly can still be refused on apply: an Ingress
# path containing `$` under `pathType: Prefix` passes `helm lint` AND
# `helm template`, and is rejected by the ingress-nginx admission webhook.
# That exact manifest reached main and left `perf/app/deploy/chart`
# unable to install (#200). The only check that catches it is a real API
# server with the webhook in front of it, so this job stands one up.
#
# Cheap on purpose: a kind cluster is ~40s and nothing here deploys an
# image or waits on a pod — every chart is rendered and then submitted as a
# server-side dry run, which is validation plus admission and no workload.
#
# The second gate here is the render-equivalence suite
# (`perf/aks/__tests__/chart-equivalence.test.ts`, #59): the two charts were
# hand-copied from one another and drift, so it renders both and asserts
# the shared hardening lessons (probes, PDB, spread, resources, drain
# budget) still agree. It runs wherever `helm` is on PATH — the hosted
# runners preinstall one, so the main CI matrix covers it too; this job
# adds ORDER, not coverage: on a chart change it fails in seconds, before
# the cluster below has finished coming up. That costs a full-monorepo
# `pnpm install` (about a minute, cached) in a job that otherwise needs
# no dependencies.
name: Charts

on:
  pull_request:
    branches: [main]
    paths:
      - 'examples/**/deploy/**'
      - 'perf/**/deploy/**'
      - 'perf/aks/__tests__/chart-equivalence.test.ts'
      - '.github/workflows/charts.yml'
  push:
    branches: [main]
    paths:
      - 'examples/**/deploy/**'
      - 'perf/**/deploy/**'
      - 'perf/aks/__tests__/chart-equivalence.test.ts'
      - '.github/workflows/charts.yml'

# Read-only: this renders charts and submits server-side dry runs against a
# throwaway kind cluster. Without a block it would inherit the org default,
# which can be write-all.
permissions:
  contents: read

concurrency:
  group: charts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create a kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: charts

      # Here and not later: a chart that has lost a lesson should fail in
      # seconds — before the 6m ingress-nginx install below, not after it.
      # (After kind-action so the run uses the helm it pins, not whichever
      # one the runner image shipped with.)
      - name: The shared hardening lessons agree across both charts
        run: pnpm test perf/aks/__tests__/chart-equivalence

      # Installed from its Helm chart, NOT the kind provider manifest: that
      # manifest pins the controller to a node labelled `ingress-ready=true`
      # (which kind-action does not set) and uses hostPorts, so the pod sits
      # Pending forever and the webhook never serves. We need only the
      # webhook, so a ClusterIP install with no node requirements is both
      # simpler and sufficient.
      - name: Install ingress-nginx (for its admission webhook)
        run: |
          set -euo pipefail
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx >/dev/null
          helm repo update >/dev/null
          helm install ingress-nginx ingress-nginx/ingress-nginx \
            -n ingress-nginx --create-namespace \
            --set controller.service.type=ClusterIP \
            --set controller.admissionWebhooks.enabled=true \
            --wait --timeout=6m

          cat > /tmp/probe.yaml <<'PROBE'
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: webhook-probe
            namespace: default
          spec:
            ingressClassName: nginx
            rules:
              - host: probe.invalid
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: probe
                          port:
                            number: 80
          PROBE

          # Ready means the webhook is JUDGING requests, and accepting or
          # denying are equally good proof of that. Only a call that never
          # reaches it (no endpoints, cert not yet trusted) means keep
          # waiting — conflating the two is how the first attempt at this
          # step failed while the webhook was perfectly healthy.
          for i in $(seq 1 30); do
            if out=$(kubectl create -f /tmp/probe.yaml --dry-run=server 2>&1); then
              echo "admission webhook is live (accepted the probe)"
              exit 0
            fi
            if grep -qi "denied the request" <<<"$out"; then
              echo "admission webhook is live (denied the probe, which still means it ran)"
              exit 0
            fi
            echo "  waiting for the webhook: $(head -1 <<<"$out")"
            sleep 5
          done
          echo "the admission webhook never judged a request — the rest of this job would prove nothing"
          exit 1

      - name: Namespaces the charts render into
        run: |
          kubectl create namespace sigx-actors-test
          kubectl create namespace sigx-chat

      # Every toggle is a DIFFERENT manifest, so each one is submitted. The
      # combinations below are the ones with structural consequences: they
      # add or remove objects, or change a path/annotation the webhook
      # inspects.
      - name: Lint and server-dry-run every chart shape
        run: |
          set -euo pipefail
          fail=0

          # Identity values (registry, ingress host) are REQUIRED with no
          # defaults — the public charts name nobody's infrastructure — so
          # every render passes generic placeholders for them.
          check() {  # check <label> <chart> <namespace> [--set …]
            local label=$1 chart=$2 ns=$3; shift 3
            if helm template release "$chart" -n "$ns" \
                 --set image.repository=registry.example.com/citest \
                 --set image.tag=citest "$@" 2>/tmp/render.err \
                 | kubectl apply -n "$ns" --dry-run=server -f - >/tmp/apply.out 2>/tmp/apply.err; then
              echo "  ✓ $label"
            else
              echo "  ✗ $label"
              sed 's/^/      /' /tmp/render.err /tmp/apply.err | grep -v '^      $' || true
              fail=1
            fi
          }

          echo "helm lint:"
          for chart in perf/aks/deploy/chart perf/app/deploy/chart; do
            helm lint "$chart" \
              --set image.repository=registry.example.com/citest \
              --set image.tag=citest \
              --set ingress.host=chat.example.test >/dev/null && echo "  ✓ $chart"
          done

          echo "perf/aks chart:"
          check "defaults"            perf/aks/deploy/chart sigx-actors-test
          check "hpa on"              perf/aks/deploy/chart sigx-actors-test --set hpa.enabled=true
          check "membership=k8s"      perf/aks/deploy/chart sigx-actors-test --set membership=k8s
          check "external redis"      perf/aks/deploy/chart sigx-actors-test --set redis.enabled=false --set redis.url=redis://ext:6379
          check "loadgen job"         perf/aks/deploy/chart sigx-actors-test --set loadgen.enabled=true --set loadgen.nameSuffix=ci
          check "required spread"     perf/aks/deploy/chart sigx-actors-test --set affinity.hostSelfSpread=required

          echo "chat chart:"
          chat_host='--set ingress.host=chat.example.test'
          check "defaults"            perf/app/deploy/chart sigx-chat $chat_host
          check "locality off"        perf/app/deploy/chart sigx-chat $chat_host --set ingress.localityRouting=false
          check "spread strict"       perf/app/deploy/chart sigx-chat $chat_host --set spread.whenUnsatisfiable=DoNotSchedule
          check "spread off"          perf/app/deploy/chart sigx-chat $chat_host --set spread.enabled=false
          check "no redis persistence" perf/app/deploy/chart sigx-chat $chat_host --set redis.persistence.enabled=false

          # A chart that gained a values key must still render when an
          # upgrade replays values from before that key existed (helm
          # --reuse-values does exactly this, and a bare .Values.new.key
          # nil-pointers the whole render).
          echo "missing new keys (the --reuse-values case):"
          check "chat, spread absent" perf/app/deploy/chart sigx-chat $chat_host --set spread=null
          check "chat, ingress toggle absent" perf/app/deploy/chart sigx-chat $chat_host --set ingress.localityRouting=null

          exit $fail

      - name: The identity values are required
        run: |
          # A chart that installs with an empty tag deploys `repo:` and the
          # pod fails with InvalidImageName in the cluster instead of here.
          # An empty repository or ingress host is worse: identity defaults
          # are exactly what the public charts must never regrow, so each
          # required value is asserted to fail INDIVIDUALLY (the others are
          # supplied, or the wrong guard could be doing the failing).
          set -euo pipefail
          refuse() {  # refuse <label> <chart> [--set …]
            local label=$1 chart=$2; shift 2
            if helm template release "$chart" "$@" >/dev/null 2>&1; then
              echo "✗ $chart rendered with $label missing — it must fail"
              exit 1
            fi
            echo "  ✓ $chart refuses an empty $label"
          }
          repo='--set image.repository=registry.example.com/citest'
          tag='--set image.tag=citest'
          host='--set ingress.host=chat.example.test'
          for chart in perf/aks/deploy/chart perf/app/deploy/chart; do
            refuse image.tag        "$chart" $repo $host
            refuse image.repository "$chart" $tag $host
          done
          refuse ingress.host perf/app/deploy/chart $repo $tag
