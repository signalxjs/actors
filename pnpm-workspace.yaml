packages:
  - packages/*
  - examples/*
  # The performance/deployment rig. A glob of its own, deliberately: it is
  # not an example, and `examples/*` is what a newcomer reads as one.
  - perf/*
  - benchmarks

onlyBuiltDependencies:
  - esbuild
  # workerd ships its platform binary through a postinstall. pnpm 10 skips
  # postinstalls that are not listed here, and the failure is opaque: the
  # binary is simply never linked and every workers test dies on spawn.
  - workerd

# Single source of truth for the sigx core version — a framework bump is a
# localized edit to these entries here, instead of hunting specifiers across
# every dependency section. A single-minor range (`^X.Y.0`) preserves core's
# single-copy guarantee: @sigx/reactivity keeps reactive state in module-local
# variables, so a second copy silently splits core's singletons (topic
# registry, DI app-context token, `instanceof` identity). `catalog:` resolves
# here in peerDeps/devDeps; `pnpm pack` rewrites it to the concrete range in
# the published manifest.
catalog:
  # The 1.0 line (rfc-server-v5, signalxjs/core#692 — #450): the server-fn
  # endpoint reads one frozen `fn.__sigx` descriptor, which every wrapper the
  # actor endpoints synthesize now carries. 1.0.1 rather than 1.0.0 is the
  # release every downstream consumer is on. The 0.15-era floors still hold
  # on this line: `deepTrack` from `@sigx/reactivity/internals` (core#651,
  # #124) is the host's change tracking, and a missing named export is a hard
  # resolution failure rather than a graceful degradation.
  "@sigx/reactivity": ^1.0.1
  "@sigx/runtime-core": ^1.0.1
  # The DOM half. Named here — rather than reached through `sigx` — because
  # `@sigx/actors-dashboard` needs the platform and its JSX intrinsics but
  # must NOT depend on the umbrella, whose first line imports
  # `@sigx/runtime-dom/platform` and so drags a renderer into anything that
  # touches it. Same single-copy reasoning as the entries around it.
  "@sigx/runtime-dom": ^1.0.1
  # The save path imports `stringifyWithHandlers` from the
  # `@sigx/serialize/stringify` SUBPATH (core#663) and relies on its emitter
  # batching runs of small rows into one native call (core#666) — on 0.15.5,
  # before that, this wiring measured SLOWER than the two-walk pair it
  # replaces (#238, #265). Every 1.x release carries both.
  "@sigx/serialize": ^1.0.1
  "@sigx/server": ^1.0.1
  "@sigx/server-renderer": ^1.0.1
  "@sigx/vite": ^1.0.1
  "sigx": ^1.0.1
