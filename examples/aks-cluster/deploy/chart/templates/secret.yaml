# Generated on install, PRESERVED on upgrade: `lookup` reads the live
# Secret first, so an upgrade never regenerates the cluster secret (which
# would partition the cluster into two mutually-401 halves mid-rollout).
# Explicit --set secrets.* always wins.
{{- $name := printf "%s-secrets" (include "chart.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $clusterSecret := .Values.secrets.clusterSecret | default (dig "data" "clusterSecret" "" $existing | b64dec) | default (randAlphaNum 32) }}
{{- $opsSecret := .Values.secrets.opsSecret | default (dig "data" "opsSecret" "" $existing | b64dec) | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
type: Opaque
data:
  clusterSecret: {{ $clusterSecret | b64enc }}
  opsSecret: {{ $opsSecret | b64enc }}
