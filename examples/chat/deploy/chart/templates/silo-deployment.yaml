# A Deployment — silo identity is minted per start, a restart is a new silo.
{{- if not .Values.image.tag }}
{{- fail "image.tag is required (immutable git-sha tags)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chat.fullname" . }}-silo
  labels:
    {{- include "chat.labels" . | nindent 4 }}
    app.kubernetes.io/component: silo
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "chat.siloSelector" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Surge first, drain second — the zero-drop rolling deploy.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "chat.labels" . | nindent 8 }}
        app.kubernetes.io/component: silo
    spec:
      # Always rendered (SSA relinquish lesson, #154): the default SA.
      serviceAccountName: default
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: silo
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: public
              containerPort: {{ .Values.ports.public }}
            - name: internal
              containerPort: {{ .Values.ports.internal }}
          env:
            - name: PORT
              value: {{ .Values.ports.public | quote }}
            - name: INTERNAL_PORT
              value: {{ .Values.ports.internal | quote }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: REDIS_URL
              value: "redis://{{ include "chat.fullname" . }}-redis:6379"
            - name: SIGX_NAMESPACE
              value: {{ .Values.env.sigxNamespace | quote }}
            - name: FETCH_CONNECTIONS
              value: {{ .Values.env.fetchConnections | quote }}
            - name: CLUSTER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "chat.fullname" . }}-secrets
                  key: clusterSecret
            - name: OPS_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "chat.fullname" . }}-secrets
                  key: opsSecret
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "chat.fullname" . }}-secrets
                  key: authSecret
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Probes hit the INTERNAL listener — the public one seals /_sigx/health.
          startupProbe:
            httpGet:
              path: /_sigx/health
              port: internal
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /_sigx/health
              port: internal
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /_sigx/health/ready
              port: internal
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.lifecycle.preStopSleepSeconds }}"]
