# The public edge, deliberately TWO Ingress objects on one host: annotations
# in ingress-nginx are per-Ingress, and the actor endpoint needs one the
# rest of the site must NOT have (see below).
#
# TLS comes from the controller's default certificate (the
# *.omniaflowtest.net wildcard) — no tls block, no cert-manager annotation
# needed for a host the wildcard covers.
#
# Shared annotations, load-bearing for the live connection:
# - proxy-buffering off: the `$live` subscribe response is long-lived
#   NDJSON; buffered, the page silently stops being live.
# - read/send-timeout 3600: belt and braces. Both stream mounts now emit a
#   keepalive every 30s (`$live` in-band, per-actor streams at the byte
#   layer), which is what actually keeps a quiet connection alive through
#   hops nobody here controls; the long timeout makes a drop rarer still on
#   the hop we do control, and the client reconnects either way.
# - NO rewrite/regex annotations of any kind: actor symbols travel
#   percent-encoded (/_sigx/actor/Room%23watch) and a rewriting location
#   would decode the %23 and break routing.
{{- $ann := dict
  "nginx.ingress.kubernetes.io/proxy-buffering" "off"
  "nginx.ingress.kubernetes.io/proxy-request-buffering" "off"
  "nginx.ingress.kubernetes.io/proxy-read-timeout" "3600"
  "nginx.ingress.kubernetes.io/proxy-send-timeout" "3600" }}
{{- $locality := dig "localityRouting" true (.Values.ingress | default dict) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "chat.fullname" . }}-web
  labels:
    {{- include "chat.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $ann | nindent 4 }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # SSR documents, assets and serverFns: plain round-robin. These
          # carry NO routing token, so hashing them would hash the empty
          # string and pin every page render onto a single host.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "chat.fullname" . }}-host
                port:
                  name: public
{{- if $locality }}
          # `$live` (and any other `$`-reserved symbol) is the ONE actor path
          # that must stay off the hash: one held-open response fans out to
          # many actors, so the runtime deliberately sends no token — and an
          # empty hash key would pin every live subscription in the
          # deployment onto a single host. A longer prefix wins in nginx, so
          # this carves it back out of the hashed Ingress below. (Every open
          # room page holds one — `Room.tsx` puts three live subscriptions on
          # a single connection — so this rule is load-bearing rather than
          # defensive, and the infra suite asserts it.)
          # ImplementationSpecific, NOT Prefix: `$` is rejected by the
          # ingress-nginx admission webhook in a Prefix path ("cannot be
          # used with pathType Prefix"), which neither `helm lint` nor
          # `helm template` can see — only a real apply does.
          - path: /_sigx/actor/$live
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "chat.fullname" . }}-host
                port:
                  name: public
{{- end }}
{{- if $locality }}
---
# The actor endpoint ONLY: hash each call to the host that owns the actor.
# Every actor request carries the routing token in `x-sigx-actor-route`
# (and in the path), so a consistent hash on it PLUS `preferLocalPolicy()`
# in the app makes the edge and the cluster agree on one owner per key —
# the documented composition, measured at 1.00 local fraction against 0.01
# for round-robin. Neither half works alone. `$live` and other reserved
# symbols carry no token and keep paying a hop by design.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "chat.fullname" . }}-actor
  labels:
    {{- include "chat.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $ann | nindent 4 }}
    nginx.ingress.kubernetes.io/upstream-hash-by: "$http_x_sigx_actor_route"
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /_sigx/actor
            pathType: Prefix
            backend:
              service:
                name: {{ include "chat.fullname" . }}-host
                port:
                  name: public
{{- end }}
