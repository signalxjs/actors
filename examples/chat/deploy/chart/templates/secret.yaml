# Generated on install, PRESERVED on upgrade (lookup guard): a regenerated
# clusterSecret mid-rollout partitions the cluster; a regenerated
# authSecret signs every user out. Explicit --set secrets.* always wins.
{{- $name := printf "%s-secrets" (include "chat.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $clusterSecret := .Values.secrets.clusterSecret | default (dig "data" "clusterSecret" "" $existing | b64dec) | default (randAlphaNum 32) }}
{{- $opsSecret := .Values.secrets.opsSecret | default (dig "data" "opsSecret" "" $existing | b64dec) | default (randAlphaNum 32) }}
{{- $authSecret := .Values.secrets.authSecret | default (dig "data" "authSecret" "" $existing | b64dec) | default (randAlphaNum 48) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "chat.labels" . | nindent 4 }}
type: Opaque
data:
  clusterSecret: {{ $clusterSecret | b64enc }}
  opsSecret: {{ $opsSecret | b64enc }}
  authSecret: {{ $authSecret | b64enc }}
